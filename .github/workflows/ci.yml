name: CI

on:
  pull_request:
    paths-ignore:
      - 'android/**'
      - 'twa/**'
  push:
    branches:
      - main
    paths-ignore:
      - 'android/**'
      - 'twa/**'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('frontend/coverage/coverage-summary.json') != '' }}
        run: |
          node -e "
            const total = require('./coverage/coverage-summary.json').total;
            const rows = ['statements', 'branches', 'functions', 'lines'].map(
              (k) => '| ' + k + ' | ' + total[k].pct + '% | ' + total[k].covered + ' / ' + total[k].total + ' |'
            );
            console.log(['### Frontend coverage', '', '| Metric | Coverage | Covered |', '| --- | --- | --- |', ...rows].join('\n'));
          " >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: ${{ !cancelled() && hashFiles('frontend/coverage/index.html') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage
          retention-days: 14

      - name: Build
        run: npm run build

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        # Same major version as docker-compose.yml.
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        # Same major version as docker-compose.yml.
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CARGO_TERM_COLOR: always
      REDIS_URL: redis://localhost:6379
      # Tests create and drop their own database per test binary on this server.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Unit and integration tests with coverage
        run: cargo llvm-cov --workspace --locked --fail-under-lines 90

      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo '### Backend coverage'
            echo
            echo '| Crate | Lines |'
            echo '| --- | --- |'
            # Per-file rows: $1 file (crate/src/...), $8 lines, $9 missed lines; TOTAL row: $10 line cover.
            cargo llvm-cov report --summary-only | awk '
              $1 ~ /\// { split($1, p, "/"); lines[p[1]] += $8; missed[p[1]] += $9 }
              $1 == "TOTAL" { total = $10 }
              END {
                for (c in lines) if (lines[c] > 0) printf "| %s | %.1f%% |\n", c, 100 * (lines[c] - missed[c]) / lines[c] | "sort"
                close("sort")
                print "| **total** | **" total "** |"
              }'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Coverage report
        if: ${{ !cancelled() }}
        run: cargo llvm-cov report --html

      - name: Upload coverage report
        if: ${{ !cancelled() && hashFiles('backend/target/llvm-cov/html/index.html') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/target/llvm-cov/html
          retention-days: 14

      - name: Build release binaries
        run: cargo build --release --locked --bins

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build API image
        run: docker build -f Dockerfile -t growth-tracker-backend:ci .

      - name: Build push worker image
        run: docker build -f Dockerfile.pushworker -t growth-tracker-pushworker:ci .

  contract:
    name: API contract (golden parity)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Build release server
        run: cargo build --release --locked --bin server

      - name: Install harness dependencies
        run: |
          python3 -m venv contract-tests/.venv
          contract-tests/.venv/bin/pip install --quiet -r contract-tests/requirements.txt

      # Replays every recorded request (all API routes) against the Rust server and fails on any
      # difference in status, headers or body. Azurite is installed by the harness via npm.
      - name: Check API against goldens
        run: >-
          contract-tests/.venv/bin/python contract-tests/parity.py check
          --server-bin target/release/server
          --goldens contract-tests/goldens
          --keep-going --fail-on-skip
          --pg-host 127.0.0.1 --pg-port 5432 --pg-user postgres --pg-password postgres
          --redis-url redis://127.0.0.1:6379

      - name: Upload server logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: contract-logs
          path: backend/contract-tests/.work/run-*/logs
          # .work is a hidden directory, which upload-artifact skips by default
          include-hidden-files: true
          retention-days: 14