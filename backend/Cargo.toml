[workspace]
resolver = "2"
members = ["crates/*"]
# Unrelated experiment with its own Cargo project
exclude = ["image_worker"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
# Internal crates
gt-core = { path = "crates/gt-core" }
gt-users = { path = "crates/gt-users" }
gt-notify = { path = "crates/gt-notify" }
gt-accounts = { path = "crates/gt-accounts" }
gt-activity = { path = "crates/gt-activity" }
gt-photos = { path = "crates/gt-photos" }
gt-comments = { path = "crates/gt-comments" }
gt-challenges = { path = "crates/gt-challenges" }
gt-jobs = { path = "crates/gt-jobs" }

# Web
axum = { version = "0.8", features = ["ws", "macros", "multipart"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "catch-panic"] }
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "server-graceful", "tokio", "http1", "http2"] }
tokio-io-timeout = "1"
bytes = "1"
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
base64 = "0.22"

# Storage
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "json", "uuid", "derive", "macros"] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager", "aio"] }

# Time
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"

# Security
jsonwebtoken = "9"
bcrypt = "0.15"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
rand = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry", "fmt", "env-filter"] }

# Email (SMTP fallback for local development; rustls + ring like reqwest and sqlx)
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1", "tokio1-rustls-tls"] }

# Misc
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
arc-swap = "1"
dotenvy = "0.15"
url = "2"
regex = "1"
thiserror = "2"
anyhow = "1"
async-trait = "0.1"

# Media (gt-photos): image decoding/resizing/JPEG encoding and multipart form parsing
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
multer = "3"
jpeg-encoder = "0.6"

# Web Push (gt-notify): VAPID ES256 signatures and RFC 8291 aes128gcm payload encryption
p256 = { version = "0.13", default-features = false, features = ["ecdh", "ecdsa", "std"] }
hkdf = "0.12"
aes-gcm = "0.10"
# WebSocket client for gt-notify's integration tests (same version axum uses)
tokio-tungstenite = "0.29"

[profile.release]
codegen-units = 4
lto = "thin"
strip = true
