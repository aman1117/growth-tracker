[package]
name = "gt-accounts"
description = "Authentication, password reset, email verification, profiles, search and follow HTTP API"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gt-core.workspace = true
gt-users.workspace = true
gt-notify.workspace = true
axum.workspace = true
tokio.workspace = true
serde.workspace = true
# `float_roundtrip`: cached autocomplete scores must parse back to the exact f64 Go wrote
# (Go's strconv.ParseFloat is correctly rounded), so a cache hit re-serializes byte-identically.
serde_json = { workspace = true, features = ["float_roundtrip"] }
sqlx.workspace = true
chrono.workspace = true
uuid.workspace = true
tracing.workspace = true
anyhow.workspace = true

[dev-dependencies]
async-trait.workspace = true
redis.workspace = true
tower.workspace = true
url.workspace = true
