<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#f6f5fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0a12" media="(prefers-color-scheme: dark)" />
    <title>Offline - Growth Tracker</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg-primary: #f6f5fb;
        --surface: rgba(255, 255, 255, 0.78);
        --surface-border: rgba(23, 20, 44, 0.08);
        --text-primary: #17142c;
        --text-secondary: #4d4966;
        --accent-ledge: #4126b8;
        --icon-bg: rgba(100, 71, 242, 0.1);
        --icon-color: #5b3fe6;
        --aurora-1: rgba(122, 97, 255, 0.18);
        --aurora-2: rgba(20, 184, 166, 0.14);
        --aurora-3: rgba(132, 204, 22, 0.12);
        --shadow: 0 24px 50px -20px rgba(52, 36, 128, 0.35);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg-primary: #0b0a12;
          --surface: rgba(26, 24, 38, 0.72);
          --surface-border: rgba(255, 255, 255, 0.08);
          --text-primary: #f3f1ff;
          --text-secondary: #b3afc9;
          --accent-ledge: #3e26a6;
          --icon-bg: rgba(138, 114, 255, 0.16);
          --icon-color: #a594ff;
          --aurora-1: rgba(115, 87, 255, 0.24);
          --aurora-2: rgba(45, 212, 191, 0.1);
          --aurora-3: rgba(163, 230, 53, 0.06);
          --shadow: 0 24px 60px -20px rgba(0, 0, 0, 0.8);
        }
      }

      body {
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif;
        background-color: var(--bg-primary);
        background-image:
          radial-gradient(60vmax 42vmax at 0% 0%, var(--aurora-1), transparent 62%),
          radial-gradient(48vmax 38vmax at 100% 6%, var(--aurora-2), transparent 62%),
          radial-gradient(56vmax 44vmax at 92% 100%, var(--aurora-3), transparent 60%);
        color: var(--text-primary);
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        -webkit-font-smoothing: antialiased;
      }

      .card {
        text-align: center;
        max-width: 380px;
        width: 100%;
        padding: 36px 28px 30px;
        border-radius: 28px;
        background: var(--surface);
        border: 1px solid var(--surface-border);
        box-shadow: var(--shadow);
        -webkit-backdrop-filter: blur(16px) saturate(160%);
        backdrop-filter: blur(16px) saturate(160%);
        animation: rise 0.45s cubic-bezier(0.16, 1, 0.3, 1);
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(16px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      .icon-wrapper {
        width: 76px;
        height: 76px;
        margin: 0 auto 20px;
        background: var(--icon-bg);
        border-radius: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--icon-color);
      }

      .icon {
        width: 36px;
        height: 36px;
      }

      h1 {
        font-size: 1.5rem;
        font-weight: 800;
        letter-spacing: -0.02em;
        margin-bottom: 8px;
      }

      p {
        font-size: 0.95rem;
        color: var(--text-secondary);
        line-height: 1.55;
        margin-bottom: 28px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        min-height: 48px;
        padding: 12px 24px;
        font-size: 1rem;
        font-weight: 700;
        font-family: inherit;
        color: #ffffff;
        background: linear-gradient(180deg, #7457ff 0%, #5c3eeb 100%);
        border: none;
        border-radius: 16px;
        cursor: pointer;
        box-shadow:
          0 3px 0 0 var(--accent-ledge),
          0 10px 24px -8px rgba(100, 71, 242, 0.5);
        transition:
          transform 0.12s ease,
          box-shadow 0.15s ease,
          filter 0.15s ease;
        -webkit-tap-highlight-color: transparent;
      }

      .btn:hover {
        filter: brightness(1.06);
      }

      .btn:active {
        transform: translateY(2px);
        box-shadow: 0 1px 0 0 var(--accent-ledge);
      }

      .btn:focus-visible {
        outline: 3px solid rgba(100, 71, 242, 0.45);
        outline-offset: 3px;
      }

      .btn-icon {
        width: 18px;
        height: 18px;
      }

      @media (prefers-reduced-motion: reduce) {
        .card {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="icon-wrapper" aria-hidden="true">
        <svg
          class="icon"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="1" y1="1" x2="23" y2="23"></line>
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
          <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
          <line x1="12" y1="20" x2="12.01" y2="20"></line>
        </svg>
      </div>
      <h1>You're offline</h1>
      <p>
        Your progress is safe. Check your connection and we'll pick up right where you left off.
      </p>
      <button class="btn" onclick="window.location.reload()">
        <svg
          class="btn-icon"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <polyline points="23 4 23 10 17 10"></polyline>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
        </svg>
        Try Again
      </button>
    </main>
  </body>
</html>
